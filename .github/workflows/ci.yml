name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # plan §3.9: lint → tsc -b → vitest run → vite build. E2E needs a live backend and runs locally.
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build
